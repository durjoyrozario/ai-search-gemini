<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Search</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f7f7fb; --card: #ffffff; --text: #1b1e2b; --muted: #6b7086;
    --accent: #4f46e5; --accent-2: #7c3aed; --border: #e3e5ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1117; --card: #171a23; --text: #e8eaf3; --muted: #9aa0b8; --border: #2a2f3d; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", "Noto Sans Devanagari", "Noto Naskh Arabic", sans-serif;
    line-height: 1.65;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 860px; margin: 0 auto; padding: 16px 20px;
  }
  .logo { font-weight: 700; font-size: 1.15rem; }
  .logo span { color: var(--accent); }
  select {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; font-size: .95rem;
  }
  main { max-width: 860px; margin: 0 auto; padding: 0 20px 60px; }
  .hero { text-align: center; padding: 36px 0 20px; }
  .hero h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0 0 8px; }
  .hero p { color: var(--muted); margin: 0; }
  form { display: flex; gap: 10px; margin-top: 24px; }
  input[type=search] {
    flex: 1; padding: 15px 18px; font-size: 1.05rem; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  button.go {
    padding: 0 24px; font-size: 1rem; font-weight: 600; color: #fff; border: 0; cursor: pointer;
    border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  button.go:disabled { opacity: .6; cursor: progress; }
  #result { margin-top: 28px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px;
  }
  .status { color: var(--muted); display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .answer h1, .answer h2, .answer h3 { margin: 1.2em 0 .4em; line-height: 1.3; }
  .answer h1:first-child, .answer h2:first-child, .answer h3:first-child { margin-top: 0; }
  .answer a { color: var(--accent); }
  .answer pre { background: var(--bg); padding: 12px; border-radius: 10px; overflow-x: auto; }
  .answer code { background: var(--bg); padding: 2px 5px; border-radius: 5px; }
  .answer table { border-collapse: collapse; width: 100%; }
  .answer th, .answer td { border: 1px solid var(--border); padding: 6px 10px; }
  .sources { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .sources h4 { margin: 0 0 8px; font-size: .95rem; color: var(--muted); }
  .sources ol { margin: 0; padding-inline-start: 22px; }
  .sources a { color: var(--accent); text-decoration: none; word-break: break-word; }
  .sources a:hover { text-decoration: underline; }
  .error { color: #d92d20; }
  .err-detail { color: var(--muted); font-size: .9rem; word-break: break-word; }
  .notice { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .notice:empty { display: none; }
</style>
</head>
<body>
<header>
  <div class="logo">AI <span>Search</span></div>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="bn">বাংলা</option>
    <option value="hi">हिन्दी</option>
    <option value="ur">اردو</option>
    <option value="ar">العربية</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
  </select>
</header>

<main>
  <section class="hero">
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
    <form id="form">
      <input id="q" type="search" autocomplete="off" required>
      <button id="btn" class="go" type="submit"></button>
    </form>
  </section>
  <section id="result" aria-live="polite"></section>
</main>

<script>
const I18N = {
  en: { title: "Ask anything", sub: "Search the web and get a detailed answer.", ph: "Type your question…", btn: "Search", searching: "Searching the web…", writing: "Writing the answer…", sources: "Sources", error: "Something went wrong. Please try again." },
  bn: { title: "যা খুশি জিজ্ঞাসা করুন", sub: "ওয়েব থেকে খুঁজে বিস্তারিত উত্তর পান।", ph: "আপনার প্রশ্ন লিখুন…", btn: "সার্চ", searching: "ওয়েবে খোঁজা হচ্ছে…", writing: "উত্তর লেখা হচ্ছে…", sources: "সোর্স", error: "কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।" },
  hi: { title: "कुछ भी पूछें", sub: "वेब पर खोजें और विस्तृत उत्तर पाएं।", ph: "अपना प्रश्न लिखें…", btn: "खोजें", searching: "वेब पर खोज रहे हैं…", writing: "उत्तर लिखा जा रहा है…", sources: "स्रोत", error: "कुछ गड़बड़ हो गई। कृपया फिर से प्रयास करें।" },
  ur: { title: "کچھ بھی پوچھیں", sub: "ویب پر تلاش کریں اور تفصیلی جواب حاصل کریں۔", ph: "اپنا سوال لکھیں…", btn: "تلاش", searching: "ویب پر تلاش جاری ہے…", writing: "جواب لکھا جا رہا ہے…", sources: "ذرائع", error: "کچھ غلط ہو گیا۔ دوبارہ کوشش کریں۔" },
  ar: { title: "اسأل أي شيء", sub: "ابحث في الويب واحصل على إجابة مفصلة.", ph: "اكتب سؤالك…", btn: "بحث", searching: "جارٍ البحث في الويب…", writing: "جارٍ كتابة الإجابة…", sources: "المصادر", error: "حدث خطأ. حاول مرة أخرى." },
  es: { title: "Pregunta lo que quieras", sub: "Busca en la web y recibe una respuesta detallada.", ph: "Escribe tu pregunta…", btn: "Buscar", searching: "Buscando en la web…", writing: "Escribiendo la respuesta…", sources: "Fuentes", error: "Algo salió mal. Inténtalo de nuevo." },
  fr: { title: "Posez n'importe quelle question", sub: "Recherchez sur le web et obtenez une réponse détaillée.", ph: "Saisissez votre question…", btn: "Rechercher", searching: "Recherche sur le web…", writing: "Rédaction de la réponse…", sources: "Sources", error: "Une erreur s'est produite. Veuillez réessayer." }
};
const RTL = new Set(["ar", "ur"]);
const NOSEARCH = {
  en: "Answered without live web search (search quota unavailable), so it may be out of date.",
  bn: "লাইভ ওয়েব সার্চ ছাড়া উত্তর দেওয়া হয়েছে (সার্চের সীমা শেষ), তাই তথ্য পুরনো হতে পারে।",
  hi: "लाइव वेब सर्च के बिना उत्तर दिया गया (सर्च सीमा उपलब्ध नहीं), इसलिए जानकारी पुरानी हो सकती है।",
  ur: "لائیو ویب سرچ کے بغیر جواب دیا گیا (سرچ کی حد دستیاب نہیں)، اس لیے معلومات پرانی ہو سکتی ہیں۔",
  ar: "تمت الإجابة بدون بحث مباشر في الويب (حد البحث غير متاح)، لذا قد تكون المعلومات قديمة.",
  es: "Respuesta sin búsqueda web en vivo (cuota de búsqueda no disponible); puede estar desactualizada.",
  fr: "Réponse sans recherche web en direct (quota de recherche indisponible) ; elle peut être obsolète."
};

const $ = (id) => document.getElementById(id);
const langSel = $("lang"), form = $("form"), input = $("q"), btn = $("btn"), result = $("result");
let lang = "en";
try { lang = localStorage.getItem("lang") || "en"; } catch {}
if (!I18N[lang]) lang = "en";

function applyLang() {
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL.has(lang) ? "rtl" : "ltr";
  $("t-title").textContent = t.title;
  $("t-sub").textContent = t.sub;
  input.placeholder = t.ph;
  btn.textContent = t.btn;
  langSel.value = lang;
}
langSel.addEventListener("change", () => {
  lang = langSel.value;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
});
applyLang();

function renderMarkdown(md) {
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(md), { ADD_ATTR: ["target"] });
  }
  const d = document.createElement("div");
  d.style.whiteSpace = "pre-wrap";
  d.textContent = md;
  return d.outerHTML;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;
  const t = I18N[lang];

  btn.disabled = true;
  result.innerHTML = `<div class="card"><div class="status"><span class="dot"></span><span id="st">${t.searching}</span></div><div class="notice" id="notice"></div><div class="answer" id="ans"></div><div id="src"></div></div>`;
  const st = $("st"), ans = $("ans"), src = $("src");
  let text = "";

  try {
    const res = await fetch("/api/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });
    if (!res.ok || !res.body) throw new Error("bad response");

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    const handle = (event, data) => {
      if (event === "status") st.textContent = t.searching;
      if (event === "text") {
        st.textContent = t.writing;
        text += data.delta;
        ans.innerHTML = renderMarkdown(text);
      }
      if (event === "sources" && data.sources.length) {
        src.className = "sources";
        src.innerHTML = `<h4>${t.sources}</h4><ol>` +
          data.sources.map((s) => `<li><a href="${encodeURI(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.title)}</a></li>`).join("") +
          `</ol>`;
      }
      if (event === "error") {
        ans.innerHTML = `<p class="error">${t.error}</p>` + (data.message ? `<p class="err-detail">${escapeHtml(data.message)}</p>` : "");
      }
      if (event === "notice") {
        $("notice").textContent = NOSEARCH[lang] || NOSEARCH.en;
      }
      if (event === "done") {
        document.querySelector(".status").style.display = "none";
        ans.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
      }
    };

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1];
        const dat = /^data: (.*)$/m.exec(chunk)?.[1];
        if (ev && dat) handle(ev, JSON.parse(dat));
      }
    }
  } catch (err) {
    ans.innerHTML = `<p class="error">${t.error}</p>`;
  } finally {
    const s = document.querySelector(".status");
    if (s) s.style.display = "none";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
