<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বিজ্ঞ এআই - Biggo AI</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  // থিম আগেই সেট করা হচ্ছে যাতে ফ্ল্যাশ না হয়
  try {
    var th = localStorage.getItem("biggo:theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = th;
  } catch (e) {}

<style>
:root {
  --bg:#f4f5f9; --panel:#ffffff; --side:#eceef5; --text:#181b28; --muted:#647089; --line:#dfe2ec;
  --accent:#3d4fd6; --accent-ink:#ffffff; --accent-soft:#e6e9fc; --user:#e6e9fc; --danger:#d92d20;
  --shadow:0 1px 2px rgba(24,27,40,.06), 0 8px 24px rgba(24,27,40,.06);
}
[data-theme="dark"] {
  --bg:#0e1017; --panel:#161923; --side:#12141c; --text:#e7e9f2; --muted:#98a1ba; --line:#262b3a;
  --accent:#8b9aff; --accent-ink:#0e1017; --accent-soft:#222848; --user:#222848; --danger:#ff7b72;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing:border-box; }
*, *::before, *::after { font-weight:400 !important; }
html, body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--text); line-height:1.75; font-size:16px; font-weight:400;
  font-family:"Inter","Anek Bangla","Noto Sans Devanagari","Noto Naskh Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

.app { display:flex; height:100%; height:100dvh; }

/* সাইডবার */
.side {
  width:290px; flex:none; background:var(--side); border-inline-end:1px solid var(--line);
  display:flex; flex-direction:column; padding:14px; gap:12px; z-index:30;
}
.brand { display:flex; align-items:center; gap:10px; padding:4px 6px; font-weight:700; font-size:1.1rem; }
.mark {
  width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-weight:700; font-size:1.05rem;
}
.new {
  display:flex; align-items:center; gap:8px; width:100%; padding:11px 14px; border-radius:12px;
  border:1px solid var(--line); background:var(--panel); font-weight:600;
}
.new:hover { border-color:var(--accent); }
.hist-h { font-size:.85rem; color:var(--muted); padding:6px 8px 0; font-weight:500; }
.hist { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin-inline:-4px; padding-inline:4px; }
.hi {
  display:flex; align-items:center; gap:6px; border-radius:10px; padding:0 4px 0 0;
}
[dir="rtl"] .hi { padding:0 0 0 4px; }
.hi:hover, .hi.on { background:var(--panel); }
.hi.on { box-shadow:inset 3px 0 0 var(--accent); }
[dir="rtl"] .hi.on { box-shadow:inset -3px 0 0 var(--accent); }
.hi .t {
  flex:1; min-width:0; text-align:start; background:none; border:0; padding:9px 12px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.95rem;
}
.hi .x { background:none; border:0; color:var(--muted); width:28px; height:28px; border-radius:8px; opacity:0; }
.hi:hover .x, .hi .x:focus-visible { opacity:1; }
.hi .x:hover { color:var(--danger); background:var(--bg); }
.empty-h { color:var(--muted); font-size:.9rem; padding:8px; }
.user-box { border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:8px; }
.me { display:flex; align-items:center; gap:10px; min-width:0; }
.me img, .me .ph { width:36px; height:36px; border-radius:50%; flex:none; object-fit:cover; }
.me .ph { background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:600; }
.me .n { min-width:0; line-height:1.3; }
.me .n b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.me .n small { color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ghost { background:none; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
.ghost:hover { border-color:var(--accent); }
.hint { color:var(--muted); font-size:.85rem; margin:0; }

/* মূল অংশ */
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.top {
  display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line);
  background:var(--panel);
}
.top h2 { flex:1; margin:0; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon {
  width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
  display:grid; place-items:center; flex:none;
}
.icon:hover { border-color:var(--accent); }
.icon svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#menu { display:none; }
select {
  background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; height:38px;
}
.th-sun { display:none; } [data-theme="dark"] .th-sun { display:block; } [data-theme="dark"] .th-moon { display:none; }

.scroll { flex:1; overflow-y:auto; scroll-behavior:smooth; }
.col { max-width:820px; margin:0 auto; padding:24px 20px 12px; }

.welcome { text-align:center; padding:8vh 0 0; }
.welcome .mark { width:56px; height:56px; font-size:1.7rem; border-radius:16px; margin:0 auto 18px; }
.welcome h1 { margin:0 0 6px; font-size:clamp(1.6rem,4vw,2.2rem); line-height:1.3; }
.welcome p { margin:0; color:var(--muted); }
.chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:28px; }
.chip {
  border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:10px 16px; font-size:.95rem;
}
.chip:hover { border-color:var(--accent); color:var(--accent); }

.msg { display:flex; gap:12px; margin:0 0 26px; }
.msg.user { justify-content:flex-end; }
.bubble {
  max-width:82%; background:var(--user); border-radius:16px 16px 4px 16px; padding:11px 16px;
  white-space:pre-wrap; overflow-wrap:anywhere;
}
[dir="rtl"] .bubble { border-radius:16px 16px 16px 4px; }
.av {
  width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-weight:700; flex:none; margin-top:2px;
}
.body { flex:1; min-width:0; }
.status { color:var(--muted); display:flex; align-items:center; gap:10px; font-size:.95rem; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--accent); animation:pulse 1s infinite ease-in-out; }
@keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }
@media (prefers-reduced-motion: reduce) { .dot { animation:none; } .scroll { scroll-behavior:auto; } }
.notice { color:var(--muted); font-size:.88rem; margin:0 0 8px; }
.notice:empty { display:none; }
.answer { overflow-wrap:anywhere; }
.answer > :first-child { margin-top:0; }
.answer h1, .answer h2, .answer h3 { line-height:1.35; margin:1.3em 0 .4em; }
.answer h1 { font-size:1.35rem; } .answer h2 { font-size:1.2rem; } .answer h3 { font-size:1.05rem; }
.answer p { margin:.6em 0; }
.answer strong, .answer b, .answer th { font-weight:600; }
.answer a { color:var(--accent); }
.answer pre { background:var(--side); border:1px solid var(--line); padding:12px 14px; border-radius:12px; overflow-x:auto; line-height:1.5; }
.answer code { background:var(--side); padding:2px 6px; border-radius:6px; font-size:.92em; }
.answer pre code { background:none; padding:0; }
.answer table { border-collapse:collapse; display:block; overflow-x:auto; max-width:100%; }
.answer th, .answer td { border:1px solid var(--line); padding:6px 12px; }
.answer th { background:var(--side); }
.answer blockquote { margin:.8em 0; padding:2px 14px; border-inline-start:3px solid var(--accent); color:var(--muted); }
.srcs { margin-top:14px; }
.srcs h4 { margin:0 0 8px; font-size:.88rem; color:var(--muted); font-weight:500; }
.srcs div { display:flex; flex-wrap:wrap; gap:8px; }
.srcs a {
  display:inline-flex; gap:8px; align-items:center; max-width:100%; padding:6px 12px; font-size:.86rem;
  border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--text); text-decoration:none;
}
.srcs a:hover { border-color:var(--accent); color:var(--accent); }
.srcs a b { color:var(--accent); font-weight:600; }
.srcs a span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px; }
.acts { margin-top:8px; }
.acts button { background:none; border:0; color:var(--muted); font-size:.86rem; padding:4px 8px; border-radius:8px; }
.acts button:hover { background:var(--side); color:var(--text); }
.err { color:var(--danger); }
.err small { display:block; color:var(--muted); }

/* ইনপুট */
.dock { padding:8px 20px calc(14px + env(safe-area-inset-bottom, 0px)); background:linear-gradient(transparent, var(--bg) 30%); }
.box {
  max-width:820px; margin:0 auto; display:flex; align-items:flex-end; gap:8px; padding:8px 8px 8px 16px;
  background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
}
[dir="rtl"] .box { padding:8px 16px 8px 8px; }
.box:focus-within { border-color:var(--accent); }
textarea {
  flex:1; resize:none; border:0; outline:0; background:none; max-height:200px; padding:9px 0; line-height:1.6;
}
textarea::placeholder { color:var(--muted); }
.send {
  width:42px; height:42px; border-radius:12px; border:0; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; flex:none;
}
.send:disabled { opacity:.4; cursor:default; }
.send svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
[dir="rtl"] .send svg.arrow { transform:scaleX(-1); }
.send .stop { display:none; } .busy .send .stop { display:block; } .busy .send .arrow { display:none; }
.foot { text-align:center; color:var(--muted); font-size:.8rem; margin:8px 0 0; }

.scrim { display:none; }
@media (max-width: 820px) {
  .side { position:fixed; inset-block:0; inset-inline-start:0; transform:translateX(-102%); transition:transform .22s; box-shadow:var(--shadow); }
  [dir="rtl"] .side { transform:translateX(102%); }
  body.open .side { transform:none; }
  body.open .scrim { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; }
  #menu { display:grid; }
  .bubble { max-width:92%; }
  .col { padding-inline:14px; }
  .dock { padding-inline:12px; }
}
</style>
</head>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="mark">বি</span><span data-i="brand">বিজ্ঞ এআই</span></div>
    <button class="new" id="new" type="button">

    <div class="hist-h" data-i="history"></div>

  <div class="scrim" id="scrim"></div>

  <section class="main">

      </button>

    <div class="scroll" id="scroll"><div class="col" id="msgs"></div></div>

    <div class="dock" id="dock">
      <div class="box">
        <textarea id="q" rows="1" autocomplete="off"></textarea>
        <button class="send" id="send" type="button" aria-label="Send">
          <svg class="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <svg class="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="foot" data-i="foot"></p>
    </div>
  </section>
</div>

const NOSEARCH = {
  en:"Answered without live web search (search quota unavailable), so it may be out of date.",
  bn:"লাইভ ওয়েব সার্চ ছাড়া উত্তর দেওয়া হয়েছে (সার্চের সীমা শেষ), তাই তথ্য পুরনো হতে পারে।",
  hi:"लाइव वेब सर्च के बिना उत्तर दिया गया (सर्च सीमा उपलब्ध नहीं), इसलिए जानकारी पुरानी हो सकती है।",
  ur:"لائیو ویب سرچ کے بغیر جواب دیا گیا (سرچ کی حد دستیاب نہیں)، اس لیے معلومات پرانی ہو سکتی ہیں۔",
  ar:"تمت الإجابة بدون بحث مباشر في الويب (حد البحث غير متاح)، لذا قد تكون المعلومات قديمة.",
  es:"Respuesta sin búsqueda web en vivo (cuota de búsqueda no disponible); puede estar desactualizada.",
  fr:"Réponse sans recherche web en direct (quota de recherche indisponible) ; elle peut être obsolète."
};
const SUG = {
  bn: ["আজকের প্রধান খবর কী?", "কোয়ান্টাম কম্পিউটিং সহজ ভাষায় বুঝিয়ে দিন", "ঢাকায় ভালো ল্যাপটপ কেনার টিপস"],
  en: ["What are today's top headlines?", "Explain quantum computing simply", "How do I choose a good laptop?"]
};
const RTL = new Set(["ar", "ur"]);
const $ = (id) => document.getElementById(id);

/* ======= স্টোরেজ ======= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let lang = store.get("biggo:lang", "bn");
if (!I18N[lang]) lang = "bn";
let user = store.get("biggo:user", null);
let chats = [], cur = null, busy = false, ctrl = null;
const key = () => "biggo:chats:" + (user ? user.sub : "guest");
const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || "";
const save = () => store.set(key(), chats.slice(0, 100));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const getChat = () => chats.find((c) => c.id === cur);

function loadChats() {
  chats = store.get(key(), []);
  cur = null;
}

/* ======= ভাষা ও থিম ======= */
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL.has(lang) ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
  $("q").placeholder = t("ph");
  $("lang").value = lang;
  renderUser(); renderHistory(); renderMessages();
}
$("lang").addEventListener("change", (e) => { lang = e.target.value; store.set("biggo:lang", lang); applyLang(); });
$("theme").addEventListener("click", () => {
  const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = n;
  try { localStorage.setItem("biggo:theme", n); } catch {}
});

/* ======= সাইডবার ======= */
const setMenu = (o) => document.body.classList.toggle("open", o);
$("menu").addEventListener("click", () => setMenu(true));
$("scrim").addEventListener("click", () => setMenu(false));

function renderHistory() {
  const h = $("hist");
  h.innerHTML = "";
  if (!chats.length) { h.innerHTML = `<div class="empty-h">${esc(t("noHist"))}</div>`; return; }
  [...chats].sort((a, b) => b.ts - a.ts).forEach((c) => {
    const row = document.createElement("div");
    row.className = "hi" + (c.id === cur ? " on" : "");
    row.innerHTML = `<button class="t" type="button"></button><button class="x" type="button" aria-label="${esc(t("del"))}" title="${esc(t("del"))}">✕</button>`;
    row.firstChild.textContent = c.title;
    row.firstChild.onclick = () => { if (busy) return; cur = c.id; renderAll(); setMenu(false); };
    row.lastChild.onclick = () => {
      if (busy) return;
      chats = chats.filter((x) => x.id !== c.id);
      if (cur === c.id) cur = null;
      save(); renderAll();
    };
    h.appendChild(row);
  });
}

function renderUser() {
  const b = $("userBox");
  if (user) {
    const av = user.picture ? `<img src="${esc(user.picture)}" alt="" referrerpolicy="no-referrer">` : `<span class="ph">${esc((user.name || "?")[0])}</span>`;
    b.innerHTML = `<div class="me">${av}<div class="n"><b>${esc(user.name || "")}</b><small>${esc(user.email || "")}</small></div></div><button class="ghost" id="logout" type="button">${esc(t("logout"))}</button>`;
    $("logout").onclick = logout;
  } else {
    b.innerHTML = `<div class="me"><span class="ph">?</span><div class="n"><b>${esc(t("guest"))}</b></div></div><div id="gbtn"></div><p class="hint" id="gnote"></p>`;
    if (GOOGLE_CLIENT_ID) { $("gnote").textContent = t("guestNote"); drawGoogle(); }
    else $("gnote").textContent = t("loginOff");
  }
}

/* ======= গুগল লগইন ======= */
function parseJwt(tk) {
  const p = tk.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(p.padEnd(p.length + (4 - p.length % 4) % 4, "="));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
}
function initGoogle() {
  if (!GOOGLE_CLIENT_ID || !window.google) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: (r) => {
      try {
        const p = parseJwt(r.credential);
        user = { sub: p.sub, name: p.name, email: p.email, picture: p.picture };
        store.set("biggo:user", user);
        loadChats(); renderAll();
      } catch {}
    }
  });
  drawGoogle();
}
function drawGoogle() {
  const el = $("gbtn");
  if (!el || !window.google || !google.accounts) return;
  google.accounts.id.renderButton(el, { theme: "outline", size: "large", shape: "pill", text: "signin_with", width: 250, locale: lang });
}
function logout() {
  try { google.accounts.id.disableAutoSelect(); } catch {}
  user = null; store.del("biggo:user");
  loadChats(); renderAll();
}

/* ======= মেসেজ রেন্ডার ======= */
function renderMarkdown(md) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md), { ADD_ATTR: ["target"] });
  return esc(md).replace(/\n/g, "<br>");
}
function fixLinks(root) { root.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; }); }

function fillSources(el, list) {
  if (!list || !list.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<h4>${esc(t("sources"))}</h4><div>` + list.filter((s) => /^https?:\/\//i.test(s.url)).map((s, i) =>
    `<a href="${esc(encodeURI(s.url))}" target="_blank" rel="noopener noreferrer"><b>${i + 1}</b><span>${esc(s.title || s.url)}</span></a>`).join("") + `</div>`;
}

function msgEl(m) {
  const d = document.createElement("div");
  if (m.role === "user") {
    d.className = "msg user";
    d.innerHTML = `<div class="bubble"></div>`;
    d.firstChild.textContent = m.text;
    return d;
  }
  d.className = "msg ai";
  d.innerHTML = `<div class="av">বি</div><div class="body"><div class="status"><span class="dot"></span><span class="st"></span></div><div class="notice"></div><div class="answer"></div><div class="srcs"></div><div class="acts"></div></div>`;
  const q = (s) => d.querySelector(s);
  if (m.notice) q(".notice").textContent = NOSEARCH[lang] || NOSEARCH.en;
  if (m.error) q(".answer").innerHTML = `<p class="err">${esc(t("error"))}${m.error !== true ? `<small>${esc(m.error)}</small>` : ""}</p>`;
  else if (m.text) { q(".answer").innerHTML = renderMarkdown(m.text); fixLinks(q(".answer")); }
  fillSources(q(".srcs"), m.sources);
  if (m.pending) q(".st").textContent = t("searching");
  else {
    q(".status").style.display = "none";
    if (m.text) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = t("copy");
      b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(m.text).then(() => { b.textContent = t("copied"); setTimeout(() => (b.textContent = t("copy")), 1500); }); };
      q(".acts").appendChild(b);
    }
  }
  return d;
}

function renderMessages() {
  const box = $("msgs"), c = getChat();
  $("title").textContent = c ? c.title : t("brand");
  box.innerHTML = "";
  if (!c || !c.msgs.length) {
    const s = SUG[lang] || SUG.en;
    box.innerHTML = `<div class="welcome"><div class="mark">বি</div><h1>${esc(t("title"))}</h1><p>${esc(t("sub"))}</p><div class="chips">${s.map((x) => `<button class="chip" type="button">${esc(x)}</button>`).join("")}</div></div>`;
    box.querySelectorAll(".chip").forEach((b) => (b.onclick = () => send(b.textContent)));
    return;
  }
  c.msgs.forEach((m) => { if (m.pending && !busy) m.pending = false; box.appendChild(msgEl(m)); });
  $("scroll").scrollTop = $("scroll").scrollHeight;
}
function renderAll() { renderHistory(); renderMessages(); }

/* ======= পাঠানো ও স্ট্রিম ======= */
async function send(text) {
  const query = (text || "").trim();
  if (!query || busy) return;
  let c = getChat();
  if (!c) {
    c = { id: Date.now().toString(36), title: query.slice(0, 48), ts: Date.now(), msgs: [] };
    chats.unshift(c); cur = c.id;
  }
  const history = c.msgs.filter((m) => m.text && !m.error).slice(-8).map((m) => ({ role: m.role, content: m.text }));
  c.msgs.push({ role: "user", text: query });
  const m = { role: "assistant", text: "", sources: [], pending: true };
  c.msgs.push(m); c.ts = Date.now();
  busy = true; document.body.classList.add("busy");
  $("q").value = ""; autosize();
  renderAll();

  const el = $("msgs").lastElementChild, st = el.querySelector(".st"), ans = el.querySelector(".answer");
  const sc = $("scroll");
  const stick = () => { if (sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160) sc.scrollTop = sc.scrollHeight; };
  ctrl = new AbortController();

  const handle = (ev, d) => {
    if (ev === "status") st.textContent = t("searching");
    else if (ev === "text") { st.textContent = t("writing"); m.text += d.delta; ans.innerHTML = renderMarkdown(m.text); stick(); }
    else if (ev === "sources") { m.sources = d.sources || []; fillSources(el.querySelector(".srcs"), m.sources); }
    else if (ev === "notice") { m.notice = true; el.querySelector(".notice").textContent = NOSEARCH[lang] || NOSEARCH.en; }
    else if (ev === "error") { m.error = d.message || true; }
  };

  try {
    const res = await fetch("/api/search", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ query, history })
    });
    if (!res.ok || !res.body) throw new Error("bad response");
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1], dat = /^data: (.*)$/m.exec(chunk)?.[1];
        if (ev && dat) { try { handle(ev, JSON.parse(dat)); } catch {} }
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") m.error = true;
  } finally {
    m.pending = false; busy = false; ctrl = null;
    document.body.classList.remove("busy");
    if (!m.text && !m.error) m.error = true;
    save(); renderAll(); $("q").focus();
  }
}

/* ======= ইনপুট ======= */
function autosize() { const q = $("q"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; }
$("q").addEventListener("input", autosize);
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($("q").value); }
});
$("send").addEventListener("click", () => { if (busy) ctrl && ctrl.abort(); else send($("q").value); });
$("new").addEventListener("click", () => { if (busy) return; cur = null; renderAll(); setMenu(false); $("q").focus(); });

loadChats();
applyLang();
</script>
</body>
</html>
